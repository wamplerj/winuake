name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 1.0.0)"
        required: true

# Creating the GitHub Release needs write access to repository contents; the default token is read-only.
permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then version="$DISPATCH_VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::'$version' is not a version like 1.2.3"; exit 1; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # Stamp the release version into the workspace before anything compiles, so the executables and their version resource
      # report the tagged version. This edit exists only in the CI checkout; it is not committed.
      - name: Set version in Cargo.toml
        shell: bash
        run: |
          sed -i '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "${{ steps.version.outputs.value }}"/' Cargo.toml
          grep -n '^version = ' Cargo.toml
          grep -q '^version = "${{ steps.version.outputs.value }}"' Cargo.toml
          cargo update --workspace
      - run: cargo xtask gen-bindings
      - name: Package x64 and ARM64
        env:
          WINUAKE_ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
          WINUAKE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}
        run: cargo xtask package --version ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: winuake-${{ steps.version.outputs.value }}
          path: |
            dist/${{ steps.version.outputs.value }}/*.zip
            dist/${{ steps.version.outputs.value }}/*-setup.exe
            dist/${{ steps.version.outputs.value }}/*.msix
            dist/${{ steps.version.outputs.value }}/SHA256SUMS.txt
            dist/${{ steps.version.outputs.value }}/winget/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.version.outputs.value }}/*.zip
            dist/${{ steps.version.outputs.value }}/*-setup.exe
            dist/${{ steps.version.outputs.value }}/*.msix
            dist/${{ steps.version.outputs.value }}/SHA256SUMS.txt

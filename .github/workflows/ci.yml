name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gen-bindings
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # ARM64 is cross-compiled on the x64 runner (the image carries the MSVC ARM64 tools); it is built and type-checked, not run.
      - run: rustup target add aarch64-pc-windows-msvc
      - run: cargo clippy --target aarch64-pc-windows-msvc -p winuake -p winuake-cli --all-targets -- -D warnings
      - run: cargo build --target aarch64-pc-windows-msvc -p winuake -p winuake-cli

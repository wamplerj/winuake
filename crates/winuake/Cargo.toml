[package]
name = "winuake"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
winuake-core = { path = "../winuake-core" }
winuake-config = { path = "../winuake-config" }
winuake-term = { version = "0.1.0", path = "../winuake-term" }
winuake-skin = { path = "../winuake-skin" }
winuake-ipc = { path = "../winuake-ipc" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-collections = "0.100.0"
windows-core = "0.100.0"
windows-link = "0.100.0"
winuake-render = { path = "../winuake-render" }
